<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Teste de Desconto</title>
</head>
<body>
    <form action="teste.php" method="POST">
        <label>Nome:</label><br>
        <input type="text" name="txtNome" required><br><br>

        <label>Valor da Compra:</label><br>
        <input type="number" step="0.01" name="txtValorCompra" required><br><br>

        <label>Forma de Pagamento:</label><br>
        <select name="cmbPag">
            <option value="cartaoCredito">Cartão de Crédito</option>
            <option value="boleto">Boleto</option>
            <option value="deposito">Depósito</option>
        </select><br><br>

        <button type="submit">Calcular Desconto</button>
    </form>
</body>
</html>
